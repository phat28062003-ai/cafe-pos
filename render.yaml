services:
  - type: web
    name: cafe-pos
    runtime: python
    buildCommand: "pip install -r requirements.txt && python manage.py migrate --noinput && python seed_data.py"
    startCommand: "uvicorn cafe_pos.asgi:application --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ALLOWED_HOSTS
        value: "*"
      - key: DEBUG
        value: "True"
